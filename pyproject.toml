[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitc"
version = "0.1.0"
description = "Git helper that drafts commits and reviews using GPT-5."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "gitc maintainers" }]
dependencies = []

[project.scripts]
gitc = "gitc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
